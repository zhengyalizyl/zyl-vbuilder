packages:
  - "apps/*"
  - "packages/*"
# TypeScript 7 (Go 版) 不再提供经典 JS 编译器 API（无 ts.sys / lib/tsc），
# @vue/compiler-sfc 与 vue-tsc 均依赖该 API，故锁在 5.9
overrides:
  typescript: ~5.9.3
allowBuilds:
  esbuild: true
  # vue-demi 的 postinstall 会按当前安装的 Vue 版本切换其 shim，不跑就用不了
  vue-demi: true
  vue-echarts: true
